<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our Family</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f7f5f2;
            color: #292725;
        }

        header {
            background: white;
            padding: 28px 20px 22px;
            text-align: center;
            border-bottom: 1px solid #ebe7e2;
        }

        .heart {
            font-size: 30px;
            margin-bottom: 5px;
        }

        header h1 {
            margin: 0;
            font-size: 27px;
            font-weight: 600;
        }

        header p {
            margin: 7px 0 0;
            color: #88827b;
            font-size: 15px;
        }

        main {
            max-width: 650px;
            margin: 0 auto;
            padding: 25px 16px 100px;
        }

        .welcome {
            margin-bottom: 25px;
        }

        .welcome h2 {
            margin: 0 0 6px;
            font-size: 21px;
            font-weight: 600;
        }

        .welcome p {
            margin: 0;
            color: #77716b;
            font-size: 15px;
        }

        .post {
            background: white;
            border-radius: 18px;
            margin-bottom: 25px;
            overflow: hidden;
            box-shadow: 0 3px 15px rgba(0,0,0,0.06);
        }

        .post-content {
            padding: 18px 19px 20px;
        }

        .post-date {
            font-size: 12px;
            color: #a09a94;
            margin-bottom: 8px;
        }

        .post-text {
            font-size: 16px;
            line-height: 1.55;
        }

        .location {
            font-size: 13px;
            color: #77716b;
            margin-top: 12px;
        }

        .empty {
            text-align: center;
            padding: 50px 20px;
            color: #99938d;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #99938d;
        }

        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background: rgba(255,255,255,0.96);
            border-top: 1px solid #e8e4df;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        nav span {
            font-size: 14px;
            color: #55504b;
        }
    </style>
</head>

<body>

    <header>
        <div class="heart">❤️</div>
        <h1>Our Family</h1>
        <p>Little moments from Austria</p>
    </header>

    <main>

        <div class="welcome">
            <h2>Latest updates</h2>
            <p>Sharing a little piece of our everyday life with you.</p>
        </div>

        <div id="posts">
            <div class="loading">
                Loading family updates...
            </div>
        </div>

    </main>

    <nav>
        <span>❤️ Our Family</span>
    </nav>


    <script>

        // -----------------------------------------
        // SUPABASE CONNECTION
        // -----------------------------------------

        const SUPABASE_URL =
            "https://efwhuwmnsikapsotlauy.supabase.co";

        const SUPABASE_KEY =
            "sb_publishable_71zpw_6tibul5KHmbaBE6A_BYGVb5FG";

        const supabaseClient =
            supabase.createClient(SUPABASE_URL, SUPABASE_KEY);


        // -----------------------------------------
        // LOAD POSTS
        // -----------------------------------------

        async function loadPosts() {

            const container = document.getElementById("posts");

            const { data, error } = await supabaseClient
                .from("posts")
                .select("*")
                .order("created_at", { ascending: false });


            if (error) {

                container.innerHTML = `
                    <div class="empty">
                        Could not load updates.
                    </div>
                `;

                console.error(error);
                return;
            }


            if (!data || data.length === 0) {

                container.innerHTML = `
                    <div class="empty">
                        No family updates yet. ❤️
                    </div>
                `;

                return;
            }


            container.innerHTML = "";


            data.forEach(post => {

                const date = new Date(post.created_at)
                    .toLocaleDateString("en-US", {
                        year: "numeric",
                        month: "long",
                        day: "numeric"
                    });


                const article = document.createElement("div");

                article.className = "post";


                article.innerHTML = `

                    <div class="post-content">

                        <div class="post-date">
                            ${date}
                        </div>

                        <div class="post-text">
                            ${escapeHtml(post.message || "")}
                        </div>

                        ${
                            post.location
                            ? `<div class="location">
                                📍 ${escapeHtml(post.location)}
                               </div>`
                            : ""
                        }

                    </div>

                `;


                container.appendChild(article);

            });

        }


        // -----------------------------------------
        // SECURITY
        // -----------------------------------------

        function escapeHtml(text) {

            const div = document.createElement("div");

            div.textContent = text;

            return div.innerHTML;

        }


        // Start app

        loadPosts();

    </script>

</body>
</html>
