<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Daily Updates</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#930527">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Raleway:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --background: #F1E5D7;
      --header: #930527;
      --button: #550317;
      --white: #ffffff;
      --text: #333333;
      --soft-text: #666666;
      --border: #eadbd0;
      --delete: #8b1e3f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: "Montserrat", sans-serif;
    }

    header {
      background: var(--white);
      padding: 32px 24px 28px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
    }

    header h1 {
      margin: 0;
      color: var(--header);
      font-family: "Raleway", sans-serif;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.2;
    }

    header p {
      margin: 12px auto 0;
      max-width: 700px;
      font-size: 18px;
      line-height: 1.5;
      color: var(--soft-text);
    }

    main {
      width: min(900px, calc(100% - 32px));
      margin: 24px auto 50px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .top-bar h2 {
      margin: 0;
      color: var(--header);
      font-family: "Raleway", sans-serif;
      font-size: 28px;
      font-weight: 700;
    }

    button {
      border: none;
      border-radius: 18px;
      background: var(--button);
      color: white;
      font-family: "Montserrat", sans-serif;
      font-size: 16px;
      font-weight: 600;
      padding: 12px 18px;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(85, 3, 23, 0.18);
    }

    button:hover {
      opacity: 0.92;
    }

    button:active {
      transform: scale(0.98);
    }

    .secondary-button {
      background: white;
      color: var(--button);
      border: 1px solid var(--border);
      box-shadow: none;
    }

    .delete-button {
      background: white;
      color: var(--delete);
      border: 1px solid #e5c8d0;
      box-shadow: none;
      font-size: 14px;
      padding: 9px 14px;
    }

    .card {
      background: var(--white);
      border-radius: 28px;
      padding: 24px;
      margin-bottom: 22px;
      box-shadow: 0 7px 22px rgba(0, 0, 0, 0.07);
    }

    .login-card {
      display: none;
    }

    .login-card h3,
    .new-post-card h3 {
      margin-top: 0;
      color: var(--header);
      font-family: "Raleway", sans-serif;
      font-size: 25px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-size: 15px;
      font-weight: 600;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px 16px;
      background: #fffdfb;
      color: var(--text);
      font-family: "Montserrat", sans-serif;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--header);
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    input[type="file"] {
      padding: 11px;
    }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .status {
      margin-top: 12px;
      font-size: 14px;
      color: var(--soft-text);
    }

    .new-post-card {
      display: none;
    }

    .expiry-help {
      margin-top: 7px;
      color: var(--soft-text);
      font-size: 13px;
      line-height: 1.4;
    }

    .post {
      background: var(--white);
      border-radius: 28px;
      padding: 24px;
      margin-bottom: 22px;
      box-shadow: 0 7px 22px rgba(0, 0, 0, 0.07);
      overflow: hidden;
    }

    .post img {
      display: block;
      width: 100%;
      max-height: 650px;
      object-fit: cover;
      border-radius: 22px;
      margin-bottom: 20px;
    }

    .post-message {
      font-size: 28px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
      margin-bottom: 16px;
    }

    .post-meta {
      color: var(--soft-text);
      font-size: 14px;
      line-height: 1.5;
    }

    .location {
      margin-top: 5px;
    }

    .post-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .reactions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .reaction-button {
      background: #fffaf7;
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: none;
      border-radius: 14px;
      padding: 7px 9px;
      font-size: 17px;
      font-weight: 500;
    }

    .reaction-button:hover {
      background: #f8eee7;
    }

    .reaction-button.active {
      background: #f1d9df;
      border-color: var(--header);
    }

    .reaction-count {
      font-size: 13px;
      margin-left: 2px;
    }

    /* COMMENTS */

    .comments-section {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .comments-title {
      color: var(--header);
      font-family: "Raleway", sans-serif;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .comment {
      background: #fffaf7;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 9px;
    }

    .comment-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 5px;
    }

    .comment-author {
      font-size: 13px;
      font-weight: 700;
      color: var(--header);
    }

    .comment-date {
      font-size: 11px;
      color: var(--soft-text);
      white-space: nowrap;
    }

    .comment-text {
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .comment-delete {
      border: none;
      background: none;
      color: var(--delete);
      box-shadow: none;
      padding: 2px 0;
      font-size: 11px;
      font-weight: 500;
      margin-top: 5px;
    }

    .comment-delete:hover {
      text-decoration: underline;
      background: none;
    }

    .comment-form {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      align-items: stretch;
    }

    .comment-input {
      flex: 1;
      min-width: 0;
      padding: 11px 14px;
      border-radius: 16px;
    }

    .comment-send {
      flex-shrink: 0;
      padding: 10px 15px;
      border-radius: 16px;
      font-size: 14px;
    }

    .no-comments {
      color: var(--soft-text);
      font-size: 13px;
      margin-bottom: 10px;
    }

    .empty-state {
      text-align: center;
      color: var(--soft-text);
      font-size: 18px;
      padding: 35px 20px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 600px) {
      header {
        padding: 26px 18px 24px;
      }

      header h1 {
        font-size: 30px;
      }

      header p {
        font-size: 16px;
      }

      main {
        width: min(100% - 20px, 900px);
        margin-top: 16px;
      }

      .card,
      .post {
        padding: 20px;
        border-radius: 24px;
      }

      .top-bar {
        align-items: flex-start;
      }

      .top-bar h2 {
        font-size: 25px;
      }

      .post-message {
        font-size: 28px;
      }

      .post-footer {
        align-items: flex-start;
        flex-direction: column;
      }

      .reactions {
        width: 100%;
      }

      .comment-form {
        flex-direction: column;
      }

      .comment-send {
        width: 100%;
      }

      .comment-header {
        flex-direction: column;
        gap: 3px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Sharing happy moments 🩷</h1>
    <p>Use this to share pictures and your favourite stories</p>
  </header>

  <main>

    <div class="top-bar">
      <h2>Latest Updates</h2>

      <div class="button-row" style="margin-top: 0;">
        <button id="loginToggleButton" onclick="toggleLogin()">
          Log in
        </button>

        <button
          id="logoutButton"
          class="secondary-button hidden"
          onclick="logout()"
        >
          Log out
        </button>
      </div>
    </div>

    <!-- LOGIN -->

    <div id="loginCard" class="card login-card">

      <h3>Log in 🩷</h3>

      <label for="email">Email</label>

      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="Your email"
      >

      <label for="password">Password</label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Your password"
      >

      <div class="button-row">
        <button onclick="login()">
          Log in
        </button>
      </div>

      <div id="loginStatus" class="status"></div>

    </div>


    <!-- NEW POST -->
    <button
  id="slideshow-button"
  class="secondary-button"
  onclick="openSlideshow()"
>
  🖼️ Slideshow
</button>

    <div id="newPostCard" class="card new-post-card">

      <h3>Share a message</h3>

      <label for="photo">
        Picture
      </label>

      <input
        id="photo"
        type="file"
        accept="image/*"
      >

      <label for="message">
        Message
      </label>

      <textarea
        id="message"
        placeholder="Share an update..."
      ></textarea>

      <label for="location">
        Location <span style="font-weight:400;">(optional)</span>
      </label>

      <input
        id="location"
        type="text"
        placeholder="e.g. Vienna 🇦🇹"
      >

      <label for="expiry">
        How long should this update stay?
      </label>

      <select id="expiry">
        <option value="forever">
          Keep forever
        </option>

        <option value="24h">
          Show for 24 hours
        </option>

        <option value="1week">
          Show for 1 week
        </option>
      </select>

      <div class="expiry-help">
        Expired updates will automatically disappear from the family feed.
      </div>

      <div class="button-row">
        <button onclick="createPost()">
          Share
        </button>
      </div>

      <div id="postStatus" class="status"></div>

    </div>


    <!-- FEED -->

    <div id="feed">

      <div class="empty-state">
        Please log in to see messages 🩷
      </div>

    </div>

  </main>


  <script>

    // --------------------------------------------------
    // SUPABASE
    // --------------------------------------------------

    const SUPABASE_URL =
      "https://efwhuwmnsikapsotlauy.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_71zpw_6tibul5KHmbaBE6A_BYGVb5FG";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // --------------------------------------------------
    // REACTIONS
    // --------------------------------------------------

    const REACTIONS = [
      "🥰",
      "😂",
      "😭",
      "😱",
      "🩷",
      "🩵"
    ];


    // --------------------------------------------------
    // LOGIN UI
    // --------------------------------------------------

    function toggleLogin() {

      const card =
        document.getElementById("loginCard");

      if (card.style.display === "block") {

        card.style.display = "none";

      } else {

        card.style.display = "block";
      }
    }


    // --------------------------------------------------
    // LOGIN
    // --------------------------------------------------

    async function login() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const status =
        document.getElementById("loginStatus");

      status.textContent =
        "Logging in...";

      const { error } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if (error) {

        status.textContent =
          "Login failed: " + error.message;

        return;
      }

      status.textContent = "";

      document.getElementById("loginCard").style.display =
        "none";
    }


    // --------------------------------------------------
    // LOGOUT
    // --------------------------------------------------

    async function logout() {

      await supabaseClient.auth.signOut();

      document.getElementById("newPostCard").style.display =
        "none";

      document.getElementById("logoutButton")
        .classList.add("hidden");

      document.getElementById("loginToggleButton")
        .classList.remove("hidden");

      document.getElementById("feed").innerHTML = `
        <div class="empty-state">
          Please log in to see messages 🩷
        </div>
      `;
    }


    // --------------------------------------------------
    // AUTH STATE
    // --------------------------------------------------

    supabaseClient.auth.onAuthStateChange(
      async (event, session) => {

        if (session) {

          document.getElementById("newPostCard")
            .style.display = "block";

          document.getElementById("logoutButton")
            .classList.remove("hidden");

          document.getElementById("loginToggleButton")
            .classList.add("hidden");

          await cleanupExpiredPosts();
          await loadPosts();

        } else {

          document.getElementById("newPostCard")
            .style.display = "none";

          document.getElementById("logoutButton")
            .classList.add("hidden");

          document.getElementById("loginToggleButton")
            .classList.remove("hidden");
        }

      }
    );


    // --------------------------------------------------
    // CLEAN UP EXPIRED POSTS
    // --------------------------------------------------

    async function cleanupExpiredPosts() {

      const now =
        new Date().toISOString();

      const {
        data: expiredPosts,
        error
      } = await supabaseClient
        .from("posts")
        .select("id, photo_url")
        .not("expires_at", "is", null)
        .lte("expires_at", now);

      if (error) {

        console.error(
          "Could not find expired posts:",
          error
        );

        return;
      }

      if (!expiredPosts || expiredPosts.length === 0) {
        return;
      }


      for (const post of expiredPosts) {

        if (post.photo_url) {

          const {
            error: photoError
          } = await supabaseClient.storage
            .from("family-photos")
            .remove([post.photo_url]);

          if (photoError) {

            console.error(
              "Could not delete expired photo:",
              photoError
            );
          }
        }


        const {
          error: deleteError
        } = await supabaseClient
          .from("posts")
          .delete()
          .eq("id", post.id);

        if (deleteError) {

          console.error(
            "Could not delete expired post:",
            deleteError
          );
        }
      }
    }


    // --------------------------------------------------
    // LOAD REACTIONS
    // --------------------------------------------------

    async function getReactionData(postIds) {

      const reactionData = {};

      for (const postId of postIds) {

        reactionData[postId] = {
          counts: {},
          userReaction: null
        };

        for (const reaction of REACTIONS) {
          reactionData[postId].counts[reaction] = 0;
        }
      }


      if (postIds.length === 0) {
        return reactionData;
      }


      const {
        data: reactions,
        error
      } = await supabaseClient
        .from("reactions")
        .select("post_id, user_id, reaction")
        .in("post_id", postIds);


      if (error) {

        console.error(
          "Could not load reactions:",
          error
        );

        return reactionData;
      }


      const {
        data: userData
      } = await supabaseClient.auth.getUser();

      const currentUserId =
        userData?.user?.id || null;


      for (const reaction of reactions || []) {

        if (!reactionData[reaction.post_id]) {
          continue;
        }


        if (
          reactionData[reaction.post_id]
            .counts[reaction.reaction] !== undefined
        ) {

          reactionData[reaction.post_id]
            .counts[reaction.reaction]++;
        }


        if (
          currentUserId &&
          reaction.user_id === currentUserId
        ) {

          reactionData[reaction.post_id]
            .userReaction = reaction.reaction;
        }
      }


      return reactionData;
    }


    // --------------------------------------------------
    // REACTION HTML
    // --------------------------------------------------

    function createReactionHtml(
      postId,
      reactionInfo
    ) {

      return `
        <div class="reactions">

          ${REACTIONS.map(reaction => {

            const count =
              reactionInfo.counts[reaction] || 0;

            const active =
              reactionInfo.userReaction === reaction
                ? "active"
                : "";

            return `
              <button
                class="reaction-button ${active}"
                onclick="toggleReaction('${postId}', '${reaction}')"
                aria-label="React ${reaction}"
              >
                ${reaction}
                <span class="reaction-count">
                  ${count}
                </span>
              </button>
            `;

          }).join("")}

        </div>
      `;
    }


    // --------------------------------------------------
    // TOGGLE REACTION
    // --------------------------------------------------

    async function toggleReaction(
      postId,
      reaction
    ) {

      const {
        data: userData
      } = await supabaseClient.auth.getUser();

      const user =
        userData?.user;


      if (!user) {

        alert(
          "Please log in to react to updates."
        );

        return;
      }


      const {
        data: existingReaction,
        error: findError
      } = await supabaseClient
        .from("reactions")
        .select("id, reaction")
        .eq("post_id", postId)
        .eq("user_id", user.id)
        .maybeSingle();


      if (findError) {

        alert(
          "Could not check your reaction: " +
          findError.message
        );

        return;
      }


      if (
        existingReaction &&
        existingReaction.reaction === reaction
      ) {

        const {
          error
        } = await supabaseClient
          .from("reactions")
          .delete()
          .eq("id", existingReaction.id);


        if (error) {

          alert(
            "Could not remove your reaction: " +
            error.message
          );

          return;
        }


        await loadPosts();
        return;
      }


      if (existingReaction) {

        const {
          error
        } = await supabaseClient
          .from("reactions")
          .update({
            reaction: reaction
          })
          .eq("id", existingReaction.id);


        if (error) {

          alert(
            "Could not change your reaction: " +
            error.message
          );

          return;
        }


        await loadPosts();
        return;
      }


      const {
        error
      } = await supabaseClient
        .from("reactions")
        .insert({
          post_id: postId,
          user_id: user.id,
          reaction: reaction
        });


      if (error) {

        alert(
          "Could not add your reaction: " +
          error.message
        );

        return;
      }


      await loadPosts();
    }


    // --------------------------------------------------
    // LOAD COMMENTS
    // --------------------------------------------------

    async function getCommentData(postIds) {

      const commentData = {};

      for (const postId of postIds) {

        commentData[postId] = [];
      }


      if (postIds.length === 0) {
        return commentData;
      }


      const {
        data: comments,
        error
      } = await supabaseClient
        .from("comments")
        .select(
          "id, post_id, user_id, comment, created_at"
        )
        .in("post_id", postIds)
        .order("created_at", {
          ascending: true
        });


      if (error) {

        console.error(
          "Could not load comments:",
          error
        );

        return commentData;
      }


      const {
        data: userData
      } = await supabaseClient.auth.getUser();

      const currentUserId =
        userData?.user?.id || null;

      const currentUserEmail =
        userData?.user?.email || "";


      for (const comment of comments || []) {

        if (!commentData[comment.post_id]) {
          continue;
        }


        comment.isOwn =
          currentUserId === comment.user_id;

        comment.author =
          comment.isOwn
            ? currentUserEmail
            : "Family member";

        commentData[comment.post_id].push(comment);
      }


      return commentData;
    }


    // --------------------------------------------------
    // COMMENT HTML
    // --------------------------------------------------

    function createCommentHtml(
      postId,
      comments
    ) {

      const commentsHtml =
        comments.length > 0

          ? comments.map(comment => {

              const date =
                new Date(comment.created_at);

              const formattedDate =
                date.toLocaleString(
                  undefined,
                  {
                    dateStyle: "medium",
                    timeStyle: "short"
                  }
                );

              const deleteButton =
                comment.isOwn
                  ? `
                    <button
                      class="comment-delete"
                      onclick="deleteComment(${comment.id})"
                    >
                      Delete
                    </button>
                  `
                  : "";

              return `
                <div class="comment">

                  <div class="comment-header">

                    <div class="comment-author">
                      ${escapeHtml(comment.author)}
                    </div>

                    <div class="comment-date">
                      ${formattedDate}
                    </div>

                  </div>

                  <div class="comment-text">
                    ${escapeHtml(comment.comment)}
                  </div>

                  ${deleteButton}

                </div>
              `;

            }).join("")

          : `
            <div class="no-comments">
              No comments yet. Be the first to say something 🩷
            </div>
          `;


      return `
        <div class="comments-section">

          <div class="comments-title">
            💬 Comments
          </div>

          ${commentsHtml}

          <div class="comment-form">

            <input
              id="comment-input-${postId}"
              class="comment-input"
              type="text"
              placeholder="Write a comment..."
              maxlength="1000"
              onkeydown="handleCommentKeydown(event, '${postId}')"
            >

            <button
              class="comment-send"
              onclick="submitComment('${postId}')"
            >
              Send
            </button>

          </div>

        </div>
      `;
    }


    // --------------------------------------------------
    // COMMENT ENTER KEY
    // --------------------------------------------------

    function handleCommentKeydown(
      event,
      postId
    ) {

      if (event.key === "Enter") {

        event.preventDefault();

        submitComment(postId);
      }
    }


    // --------------------------------------------------
    // ADD COMMENT
    // --------------------------------------------------

    async function submitComment(postId) {

      const input =
        document.getElementById(
          `comment-input-${postId}`
        );


      if (!input) {
        return;
      }


      const comment =
        input.value.trim();


      if (!comment) {
        return;
      }


      const {
        data: userData
      } = await supabaseClient.auth.getUser();


      const user =
        userData?.user;


      if (!user) {

        alert(
          "Please log in to comment."
        );

        return;
      }


      input.disabled = true;


      const {
        error
      } = await supabaseClient
        .from("comments")
        .insert({
          post_id: postId,
          user_id: user.id,
          comment: comment
        });


      input.disabled = false;


      if (error) {

        alert(
          "Could not add your comment: " +
          error.message
        );

        return;
      }


      await loadPosts();
    }


    // --------------------------------------------------
    // DELETE COMMENT
    // --------------------------------------------------

    async function deleteComment(commentId) {

      const confirmed =
        confirm(
          "Delete this comment?"
        );


      if (!confirmed) {
        return;
      }


      const {
        error
      } = await supabaseClient
        .from("comments")
        .delete()
        .eq("id", commentId);


      if (error) {

        alert(
          "Could not delete the comment: " +
          error.message
        );

        return;
      }


      await loadPosts();
    }


    // --------------------------------------------------
    // LOAD POSTS
    // --------------------------------------------------

    async function loadPosts() {

      const feed =
        document.getElementById("feed");

      feed.innerHTML = `
        <div class="empty-state">
          Loading updates... 🩷
        </div>
      `;


      const now =
        new Date().toISOString();


      const {
        data,
        error
      } = await supabaseClient
        .from("posts")
        .select("*")
        .or(
          `expires_at.is.null,expires_at.gt.${now}`
        )
        .order("created_at", {
          ascending: false
        });


      if (error) {

        feed.innerHTML = `
          <div class="empty-state">
            Could not load updates.<br><br>
            ${escapeHtml(error.message)}
          </div>
        `;

        return;
      }


      if (!data || data.length === 0) {

        feed.innerHTML = `
          <div class="empty-state">
            No updates yet 🩷
          </div>
        `;

        return;
      }


      // Load reactions

      const postIds =
        data.map(post => post.id);

      const reactionData =
        await getReactionData(postIds);


      // Load comments

      const commentData =
        await getCommentData(postIds);


      feed.innerHTML = "";


      for (const post of data) {

        let imageHtml = "";


        // ----------------------------------------------
        // PRIVATE PHOTO
        // ----------------------------------------------

        if (post.photo_url) {

          const {
            data: signedData,
            error: signedError
          } = await supabaseClient.storage
            .from("family-photos")
            .createSignedUrl(
              post.photo_url,
              60 * 60
            );


          if (
            !signedError &&
            signedData?.signedUrl
          ) {

            imageHtml = `
              <img
                src="${signedData.signedUrl}"
                alt="Family update"
              >
            `;
          }
        }


        // ----------------------------------------------
        // MESSAGE
        // ----------------------------------------------

        let messageHtml = "";

        if (post.message) {

          messageHtml = `
            <div class="post-message">
              ${escapeHtml(post.message)}
            </div>
          `;
        }


        // ----------------------------------------------
        // DATE
        // ----------------------------------------------

        const date =
          new Date(post.created_at);

        const formattedDate =
          date.toLocaleString(
            undefined,
            {
              dateStyle: "medium",
              timeStyle: "short"
            }
          );


        // ----------------------------------------------
        // LOCATION
        // ----------------------------------------------

        let locationHtml = "";

        if (post.location) {

          locationHtml = `
            <div class="location">
              📍 ${escapeHtml(post.location)}
            </div>
          `;
        }


        // ----------------------------------------------
        // EXPIRY
        // ----------------------------------------------

        let expiryHtml = "";

        if (post.expires_at) {

          const expiryDate =
            new Date(post.expires_at);

          expiryHtml = `
            <div>
              ⏰ Until ${expiryDate.toLocaleString(
                undefined,
                {
                  dateStyle: "medium",
                  timeStyle: "short"
                }
              )}
            </div>
          `;
        }


        // ----------------------------------------------
        // REACTIONS
        // ----------------------------------------------

        const postReactionData =
          reactionData[post.id] || {
            counts: {},
            userReaction: null
          };


        const reactionsHtml =
          createReactionHtml(
            post.id,
            postReactionData
          );


        // ----------------------------------------------
        // COMMENTS
        // ----------------------------------------------

        const postComments =
          commentData[post.id] || [];


        const commentsHtml =
          createCommentHtml(
            post.id,
            postComments
          );


        // ----------------------------------------------
        // POST
        // ----------------------------------------------

        const postElement =
          document.createElement("div");

        postElement.className = "post";

        postElement.innerHTML = `
          ${imageHtml}

          ${messageHtml}

          <div class="post-meta">
            ${formattedDate}
            ${locationHtml}
            ${expiryHtml}
          </div>

          <div class="post-footer">

            ${reactionsHtml}

            <button
              class="delete-button"
              onclick="deletePost('${post.id}', ${post.photo_url ? `'${escapeJs(post.photo_url)}'` : "null"})"
            >
              🗑️ Delete
            </button>

          </div>

          ${commentsHtml}
        `;

        feed.appendChild(postElement);
      }
    }


    // --------------------------------------------------
    // CREATE POST
    // --------------------------------------------------

    async function createPost() {

      const photoInput =
        document.getElementById("photo");

      const messageInput =
        document.getElementById("message");

      const locationInput =
        document.getElementById("location");

      const expiryInput =
        document.getElementById("expiry");

      const status =
        document.getElementById("postStatus");


      const file =
        photoInput.files[0];

      const message =
        messageInput.value.trim();

      const location =
        locationInput.value.trim();

      const expiry =
        expiryInput.value;


      if (!file && !message) {

        status.textContent =
          "Please add a picture or a message.";

        return;
      }


      status.textContent =
        "Sharing with everyone";


      const {
        data: userData
      } = await supabaseClient.auth.getUser();


      if (!userData?.user) {

        status.textContent =
          "Please log in again.";

        return;
      }


      // ----------------------------------------------
      // EXPIRATION
      // ----------------------------------------------

      let expiresAt = null;

      if (expiry === "24h") {

        expiresAt =
          new Date(
            Date.now() + 24 * 60 * 60 * 1000
          ).toISOString();

      } else if (expiry === "1week") {

        expiresAt =
          new Date(
            Date.now() + 7 * 24 * 60 * 60 * 1000
          ).toISOString();
      }


      // ----------------------------------------------
      // UPLOAD PHOTO
      // ----------------------------------------------

      let photoPath = null;


      if (file) {

        const extension =
          file.name.includes(".")
            ? file.name
                .split(".")
                .pop()
                .toLowerCase()
            : "jpg";


        const fileName =
          Date.now() +
          "-" +
          crypto.randomUUID() +
          "." +
          extension;


        const {
          error: uploadError
        } = await supabaseClient.storage
          .from("family-photos")
          .upload(
            fileName,
            file
          );


        if (uploadError) {

          status.textContent =
            "Photo upload failed: " +
            uploadError.message;

          return;
        }


        photoPath =
          fileName;
      }


      // ----------------------------------------------
      // INSERT POST
      // ----------------------------------------------

      const {
        error: insertError
      } = await supabaseClient
        .from("posts")
        .insert({

          message:
            message || null,

          photo_url:
            photoPath,

          location:
            location || null,

          expires_at:
            expiresAt
        });


      if (insertError) {

        if (photoPath) {

          await supabaseClient.storage
            .from("family-photos")
            .remove([photoPath]);
        }


        status.textContent =
          "Could not save the update: " +
          insertError.message;

        return;
      }


      // ----------------------------------------------
      // RESET
      // ----------------------------------------------

      photoInput.value = "";
      messageInput.value = "";
      locationInput.value = "";
      expiryInput.value = "forever";


      status.textContent =
        "Shared";


      await loadPosts();


      setTimeout(() => {

        status.textContent = "";

      }, 3000);
    }


    // --------------------------------------------------
    // DELETE POST
    // --------------------------------------------------

    async function deletePost(
      postId,
      photoPath
    ) {

      const confirmed =
        confirm(
          "Delete this update?\n\nThis cannot be undone."
        );


      if (!confirmed) {
        return;
      }


      if (photoPath) {

        const {
          error: photoError
        } = await supabaseClient.storage
          .from("family-photos")
          .remove([photoPath]);


        if (photoError) {

          console.error(
            "Photo deletion failed:",
            photoError
          );
        }
      }


      const {
        error
      } = await supabaseClient
        .from("posts")
        .delete()
        .eq("id", postId);


      if (error) {

        alert(
          "Could not delete the update: " +
          error.message
        );

        return;
      }


      await loadPosts();
    }


    // --------------------------------------------------
    // ESCAPE HTML
    // --------------------------------------------------

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    // --------------------------------------------------
    // ESCAPE JAVASCRIPT STRINGS
    // --------------------------------------------------

    function escapeJs(value) {

      return String(value)
        .replace(/\\/g, "\\\\")
        .replace(/'/g, "\\'")
        .replace(/"/g, '\\"')
        .replace(/\n/g, "\\n")
        .replace(/\r/g, "\\r");
    }


    // --------------------------------------------------
    // INITIAL SESSION CHECK
    // --------------------------------------------------

    async function checkSession() {

      const {
        data
      } = await supabaseClient.auth.getSession();


      if (data?.session) {

        document.getElementById("newPostCard")
          .style.display = "block";

        document.getElementById("logoutButton")
          .classList.remove("hidden");

        document.getElementById("loginToggleButton")
          .classList.add("hidden");

        await cleanupExpiredPosts();
        await loadPosts();
      }
    }


    checkSession();


    // --------------------------------------------------
    // SERVICE WORKER / PWA
    // --------------------------------------------------

    if ("serviceWorker" in navigator) {

      window.addEventListener("load", () => {

        navigator.serviceWorker
          .register("./service-worker.js")

          .then(() => {

            console.log(
              "Service worker registered"
            );

          })

          .catch(error => {

            console.error(
              "Service worker registration failed:",
              error
            );

          });

      });
    }

  </script>
