<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Daily Updates 😊</title>

  <!-- PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#930527">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Raleway:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --background: #F1E5D7;
      --header: #930527;
      --button: #550317;
      --white: #ffffff;
      --text: #333333;
      --soft-text: #666666;
      --border: #eadbd0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: "Montserrat", sans-serif;
    }

    header {
      background: var(--white);
      padding: 32px 24px 28px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
    }

    header h1 {
      margin: 0;
      color: var(--header);
      font-family: "Raleway", sans-serif;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.2;
    }

    header p {
      margin: 12px auto 0;
      max-width: 700px;
      font-size: 18px;
      line-height: 1.5;
      color: var(--soft-text);
    }

    main {
      width: min(900px, calc(100% - 32px));
      margin: 24px auto 50px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .top-bar h2 {
      margin: 0;
      color: var(--header);
      font-family: "Raleway", sans-serif;
      font-size: 28px;
      font-weight: 700;
    }

    button {
      border: none;
      border-radius: 18px;
      background: var(--button);
      color: white;
      font-family: "Montserrat", sans-serif;
      font-size: 16px;
      font-weight: 600;
      padding: 12px 18px;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(85, 3, 23, 0.18);
    }

    button:hover {
      opacity: 0.92;
    }

    button:active {
      transform: scale(0.98);
    }

    .secondary-button {
      background: white;
      color: var(--button);
      border: 1px solid var(--border);
      box-shadow: none;
    }

    .card {
      background: var(--white);
      border-radius: 28px;
      padding: 24px;
      margin-bottom: 22px;
      box-shadow: 0 7px 22px rgba(0, 0, 0, 0.07);
    }

    .login-card {
      display: none;
    }

    .login-card h3,
    .new-post-card h3 {
      margin-top: 0;
      color: var(--header);
      font-family: "Raleway", sans-serif;
      font-size: 25px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-size: 15px;
      font-weight: 600;
    }

    input,
    textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px 16px;
      background: #fffdfb;
      color: var(--text);
      font-family: "Montserrat", sans-serif;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    textarea:focus {
      border-color: var(--header);
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    input[type="file"] {
      padding: 11px;
    }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .status {
      margin-top: 12px;
      font-size: 14px;
      color: var(--soft-text);
    }

    .new-post-card {
      display: none;
    }

    .post {
      background: var(--white);
      border-radius: 28px;
      padding: 24px;
      margin-bottom: 22px;
      box-shadow: 0 7px 22px rgba(0, 0, 0, 0.07);
      overflow: hidden;
    }

    .post img {
      display: block;
      width: 100%;
      max-height: 650px;
      object-fit: cover;
      border-radius: 22px;
      margin-bottom: 20px;
    }

    .post-message {
      font-size: 28px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
      margin-bottom: 16px;
    }

    .post-meta {
      color: var(--soft-text);
      font-size: 14px;
      line-height: 1.5;
    }

    .location {
      margin-top: 5px;
    }

    .empty-state {
      text-align: center;
      color: var(--soft-text);
      font-size: 18px;
      padding: 35px 20px;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 600px) {
      header {
        padding: 26px 18px 24px;
      }

      header h1 {
        font-size: 30px;
      }

      header p {
        font-size: 16px;
      }

      main {
        width: min(100% - 20px, 900px);
        margin-top: 16px;
      }

      .card,
      .post {
        padding: 20px;
        border-radius: 24px;
      }

      .top-bar {
        align-items: flex-start;
      }

      .top-bar h2 {
        font-size: 25px;
      }

      .post-message {
        font-size: 28px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Sharing our happy moments 🩷</h1>
    <p>Use this to share updated pictures and your favourite stories</p>
  </header>

  <main>

    <div class="top-bar">
      <h2>Latest Updates</h2>

      <div class="button-row" style="margin-top: 0;">
        <button id="loginToggleButton" onclick="toggleLogin()">
          Log in
        </button>

        <button
          id="logoutButton"
          class="secondary-button hidden"
          onclick="logout()"
        >
          Log out
        </button>
      </div>
    </div>

    <!-- LOGIN -->
    <div id="loginCard" class="card login-card">

      <h3>Log in 🩷</h3>

      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="Your email"
      >

      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Your password"
      >

      <div class="button-row">
        <button onclick="login()">
          Log in
        </button>
      </div>

      <div id="loginStatus" class="status"></div>

    </div>

    <!-- NEW POST -->
    <div id="newPostCard" class="card new-post-card">

      <h3>Share something with the family 🫶</h3>

      <label for="photo">
        Picture
      </label>

      <input
        id="photo"
        type="file"
        accept="image/*"
      >

      <label for="message">
        Message
      </label>

      <textarea
        id="message"
        placeholder="Share an update... 😊"
      ></textarea>

      <label for="location">
        Location <span style="font-weight:400;">(optional)</span>
      </label>

      <input
        id="location"
        type="text"
        placeholder="e.g. Vienna 🇦🇹"
      >

      <div class="button-row">
        <button onclick="createPost()">
          Share with the family 🫶
        </button>
      </div>

      <div id="postStatus" class="status"></div>

    </div>

    <!-- FEED -->
    <div id="feed">
      <div class="empty-state">
        Please log in to see the family updates 🩷
      </div>
    </div>

  </main>


  <script>

    // --------------------------------------------------
    // SUPABASE
    // --------------------------------------------------

    const SUPABASE_URL =
      "https://efwhuwmnsikapsotlauy.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_71zpw_6tibul5KHmbaBE6A_BYGVb5FG";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    // --------------------------------------------------
    // LOGIN UI
    // --------------------------------------------------

    function toggleLogin() {

      const card =
        document.getElementById("loginCard");

      if (card.style.display === "block") {
        card.style.display = "none";
      } else {
        card.style.display = "block";
      }
    }


    // --------------------------------------------------
    // LOGIN
    // --------------------------------------------------

    async function login() {

      const email =
        document.getElementById("email").value.trim();

      const password =
        document.getElementById("password").value;

      const status =
        document.getElementById("loginStatus");

      status.textContent = "Logging in...";

      const { error } =
        await supabaseClient.auth.signInWithPassword({
          email,
          password
        });

      if (error) {

        status.textContent =
          "Login failed: " + error.message;

        return;
      }

      status.textContent = "";

      document.getElementById("loginCard").style.display =
        "none";
    }


    // --------------------------------------------------
    // LOGOUT
    // --------------------------------------------------

    async function logout() {

      await supabaseClient.auth.signOut();

      document.getElementById("newPostCard").style.display =
        "none";

      document.getElementById("logoutButton")
        .classList.add("hidden");

      document.getElementById("loginToggleButton")
        .classList.remove("hidden");

      document.getElementById("feed").innerHTML = `
        <div class="empty-state">
          Please log in to see the family updates 🩷
        </div>
      `;
    }


    // --------------------------------------------------
    // AUTH STATE
    // --------------------------------------------------

    supabaseClient.auth.onAuthStateChange(
      async (event, session) => {

        if (session) {

          document.getElementById("newPostCard")
            .style.display = "block";

          document.getElementById("logoutButton")
            .classList.remove("hidden");

          document.getElementById("loginToggleButton")
            .classList.add("hidden");

          await loadPosts();

        } else {

          document.getElementById("newPostCard")
            .style.display = "none";

          document.getElementById("logoutButton")
            .classList.add("hidden");

          document.getElementById("loginToggleButton")
            .classList.remove("hidden");
        }

      }
    );


    // --------------------------------------------------
    // LOAD POSTS
    // --------------------------------------------------

    async function loadPosts() {

      const feed =
        document.getElementById("feed");

      feed.innerHTML = `
        <div class="empty-state">
          Loading updates... 🩷
        </div>
      `;

      const {
        data,
        error
      } = await supabaseClient
        .from("posts")
        .select("*")
        .order("created_at", {
          ascending: false
        });

      if (error) {

        feed.innerHTML = `
          <div class="empty-state">
            Could not load updates.<br><br>
            ${escapeHtml(error.message)}
          </div>
        `;

        return;
      }

      if (!data || data.length === 0) {

        feed.innerHTML = `
          <div class="empty-state">
            No updates yet 🩷
          </div>
        `;

        return;
      }

      feed.innerHTML = "";

      for (const post of data) {

        let imageHtml = "";

        // ----------------------------------------------
        // PRIVATE PHOTO
        // ----------------------------------------------

        if (post.photo_url) {

          const {
            data: signedData,
            error: signedError
          } = await supabaseClient.storage
            .from("family-photos")
            .createSignedUrl(
              post.photo_url,
              60 * 60
            );

          if (!signedError && signedData?.signedUrl) {

            imageHtml = `
              <img
                src="${signedData.signedUrl}"
                alt="Family update"
              >
            `;
          }
        }


        // ----------------------------------------------
        // MESSAGE
        // ----------------------------------------------

        let messageHtml = "";

        if (post.message) {

          messageHtml = `
            <div class="post-message">
              ${escapeHtml(post.message)}
            </div>
          `;
        }


        // ----------------------------------------------
        // DATE
        // ----------------------------------------------

        const date =
          new Date(post.created_at);

        const formattedDate =
          date.toLocaleString(
            undefined,
            {
              dateStyle: "medium",
              timeStyle: "short"
            }
          );


        // ----------------------------------------------
        // LOCATION
        // ----------------------------------------------

        let locationHtml = "";

        if (post.location) {

          locationHtml = `
            <div class="location">
              📍 ${escapeHtml(post.location)}
            </div>
          `;
        }


        // ----------------------------------------------
        // POST
        // ----------------------------------------------

        const postElement =
          document.createElement("div");

        postElement.className = "post";

        postElement.innerHTML = `
          ${imageHtml}

          ${messageHtml}

          <div class="post-meta">
            ${formattedDate}
            ${locationHtml}
          </div>
        `;

        feed.appendChild(postElement);
      }
    }


    // --------------------------------------------------
    // CREATE POST
    // --------------------------------------------------

    async function createPost() {

      const photoInput =
        document.getElementById("photo");

      const messageInput =
        document.getElementById("message");

      const locationInput =
        document.getElementById("location");

      const status =
        document.getElementById("postStatus");

      const file =
        photoInput.files[0];

      const message =
        messageInput.value.trim();

      const location =
        locationInput.value.trim();


      if (!file && !message) {

        status.textContent =
          "Please add a picture or a message.";

        return;
      }


      status.textContent =
        "Sharing with the family... 🫶";


      // ----------------------------------------------
      // CURRENT USER
      // ----------------------------------------------

      const {
        data: userData
      } = await supabaseClient.auth.getUser();

      if (!userData?.user) {

        status.textContent =
          "Please log in again.";

        return;
      }


      // ----------------------------------------------
      // UPLOAD PHOTO
      // ----------------------------------------------

      let photoPath = null;

      if (file) {

        const extension =
          file.name.includes(".")
            ? file.name.split(".").pop().toLowerCase()
            : "jpg";

        const fileName =
          Date.now() +
          "-" +
          crypto.randomUUID() +
          "." +
          extension;


        const {
          error: uploadError
        } = await supabaseClient.storage
          .from("family-photos")
          .upload(
            fileName,
            file
          );


        if (uploadError) {

          status.textContent =
            "Photo upload failed: " +
            uploadError.message;

          return;
        }

        photoPath = fileName;
      }


      // ----------------------------------------------
      // INSERT POST
      // ----------------------------------------------

      const {
        error: insertError
      } = await supabaseClient
        .from("posts")
        .insert({
          message:
            message || null,

          photo_url:
            photoPath,

          location:
            location || null
        });


      if (insertError) {

        status.textContent =
          "Could not save the update: " +
          insertError.message;

        return;
      }


      // ----------------------------------------------
      // RESET FORM
      // ----------------------------------------------

      photoInput.value = "";
      messageInput.value = "";
      locationInput.value = "";

      status.textContent =
        "Shared with the family 🩷";

      await loadPosts();

      setTimeout(() => {
        status.textContent = "";
      }, 3000);
    }


    // --------------------------------------------------
    // ESCAPE HTML
    // --------------------------------------------------

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    // --------------------------------------------------
    // INITIAL SESSION CHECK
    // --------------------------------------------------

    async function checkSession() {

      const {
        data
      } = await supabaseClient.auth.getSession();

      if (data?.session) {

        document.getElementById("newPostCard")
          .style.display = "block";

        document.getElementById("logoutButton")
          .classList.remove("hidden");

        document.getElementById("loginToggleButton")
          .classList.add("hidden");

        await loadPosts();
      }
    }

    checkSession();

  </script>
<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js")
        .then(() => {
          console.log("Service worker registered");
        })
        .catch(error => {
          console.error("Service worker registration failed:", error);
        });
    });
  }
</script>

</body>
</html>
