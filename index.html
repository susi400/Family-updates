<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Daily Updates</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#930527">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Raleway:wght@500;600;700&display=swap"
    rel="stylesheet"
  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --background: #F1E5D7;
      --header: #930527;
      --button: #550317;
      --white: #ffffff;
      --text: #333333;
      --soft-text: #666666;
      --border: #eadbd0;
      --delete: #8b1e3f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: "Montserrat", sans-serif;
    }

    header {
      background: var(--white);
      padding: 32px 24px 28px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
    }

    header h1 {
      margin: 0;
      color: var(--header);
      font-family: "Raleway", sans-serif;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.2;
    }

    header p {
      margin: 12px auto 0;
      max-width: 700px;
      font-size: 18px;
      line-height: 1.5;
      color: var(--soft-text);
    }

    main {
      width: min(900px, calc(100% - 32px));
      margin: 24px auto 50px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .top-bar h2 {
      margin: 0;
      color: var(--header);
      font-family: "Raleway", sans-serif;
      font-size: 28px;
      font-weight: 700;
    }

    button {
      border: none;
      border-radius: 18px;
      background: var(--button);
      color: white;
      font-family: "Montserrat", sans-serif;
      font-size: 16px;
      font-weight: 600;
      padding: 12px 18px;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(85, 3, 23, 0.18);
    }

    button:hover {
      opacity: 0.92;
    }

    button:active {
      transform: scale(0.98);
    }

    .secondary-button {
      background: white;
      color: var(--button);
      border: 1px solid var(--border);
      box-shadow: none;
    }

    .delete-button {
      background: white;
      color: var(--delete);
      border: 1px solid #e5c8d0;
      box-shadow: none;
      font-size: 14px;
      padding: 9px 14px;
    }

    .card {
      background: var(--white);
      border-radius: 28px;
      padding: 24px;
      margin-bottom: 22px;
      box-shadow: 0 7px 22px rgba(0, 0, 0, 0.07);
    }

    .login-card {
      display: none;
    }

    .login-card h3,
    .new-post-card h3 {
      margin-top: 0;
      color: var(--header);
      font-family: "Raleway", sans-serif;
      font-size: 25px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-size: 15px;
      font-weight: 600;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px 16px;
      background: #fffdfb;
      color: var(--text);
      font-family: "Montserrat", sans-serif;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--header);
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    input[type="file"] {
      padding: 11px;
    }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .status {
      margin-top: 12px;
      font-size: 14px;
      color: var(--soft-text);
    }

    .new-post-card {
      display: none;
    }

    .expiry-help {
      margin-top: 7px;
      color: var(--soft-text);
      font-size: 13px;
      line-height: 1.4;
    }

    .post {
      background: var(--white);
      border-radius: 28px;
      padding: 24px;
      margin-bottom: 22px;
      box-shadow: 0 7px 22px rgba(0, 0, 0, 0.07);
      overflow: hidden;
    }

    .post img {
      display: block;
      width: 100%;
      max-height: 650px;
      object-fit: cover;
      border-radius: 22px;
      margin-bottom: 20px;
    }

    .post-message {
      font-size: 28px;
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
      margin-bottom: 16px;
    }

    .post-meta {
      color: var(--soft-text);
      font-size: 14px;
      line-height: 1.5;
    }

    .location {
      margin-top: 5px;
    }

    .post-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .reactions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      align-items: center;
    }

    .reaction-button {
      background: #fffaf7;
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: none;
      border-radius: 14px;
      padding: 7px 9px;
      font-size: 17px;
      font-weight: 500;
    }

    .reaction-button:hover {
      background: #f8eee7;
    }

    .reaction-button.active {
      background: #f1d9df;
      border-color: var(--header);
    }

    .reaction-count {
      font-size: 13px;
      margin-left: 2px;
    }

    /* COMMENTS */

    .comments-section {
      margin-top: 18px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
    }

    .comments-title {
      color: var(--header);
      font-family: "Raleway", sans-serif;
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .comment {
      background: #fffaf7;
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 12px 14px;
      margin-bottom: 9px;
    }

    .comment-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 5px;
    }

    .comment-author {
      font-size: 13px;
      font-weight: 700;
      color: var(--header);
    }

    .comment-date {
      font-size: 11px;
      color: var(--soft-text);
      white-space: nowrap;
    }

    .comment-text {
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .comment-delete {
      border: none;
      background: none;
      color: var(--delete);
      box-shadow: none;
      padding: 2px 0;
      font-size: 11px;
      font-weight: 500;
      margin-top: 5px;
    }

    .comment-delete:hover {
      text-decoration: underline;
      background: none;
    }

    .comment-form {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      align-items: stretch;
    }

    .comment-input {
      flex: 1;
      min-width: 0;
      padding: 11px 14px;
      border-radius: 16px;
    }

    .comment-send {
      flex-shrink: 0;
      padding: 10px 15px;
      border-radius: 16px;
      font-size: 14px;
    }

    .no-comments {
      color: var(--soft-text);
      font-size: 13px;
      margin-bottom: 10px;
    }

    .empty-state {
      text-align: center;
      color: var(--soft-text);
      font-size: 18px;
      padding: 35px 20px;
    }

    .hidden {
      display: none !important;
    }

    /* ==================================================
       FULL-SCREEN SLIDESHOW
       ================================================== */

    .slideshow-modal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #000000;
      align-items: center;
      justify-content: center;
      padding: 0;
      overflow: hidden;
    }

    .slideshow-content {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    #slideshow-slide {
      position: absolute;
      inset: 0;

      width: 100vw;
      height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      overflow: hidden;
      text-align: center;
      color: white;

      padding: 0;
    }

    #slideshow-slide img {
      display: block;

      width: auto;
      height: auto;

      max-width: 100vw;
      max-height: 100vh;

      object-fit: contain;

      border-radius: 0;

      margin: 0;
    }

    .slideshow-message {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 80px;

      color: white;

      font-size: 30px;
      line-height: 1.4;

      white-space: pre-wrap;
      word-break: break-word;

      max-width: 1000px;
      margin: 0 auto;

      padding: 70px 40px 30px;

      background: linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0),
        rgba(0, 0, 0, 0.75)
      );

      text-shadow:
        0 2px 8px rgba(0, 0, 0, 0.7);

      z-index: 2;
    }

    .slideshow-meta {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 52px;

      color: rgba(255, 255, 255, 0.9);

      font-size: 14px;
      line-height: 1.6;

      padding: 0 30px;

      text-shadow:
        0 2px 6px rgba(0, 0, 0, 0.8);

      z-index: 3;
    }

    .slideshow-counter {
      position: absolute;

      bottom: 22px;
      left: 0;
      right: 0;

      color: rgba(255, 255, 255, 0.65);

      font-size: 13px;

      z-index: 3;

      text-shadow:
        0 2px 6px rgba(0, 0, 0, 0.8);
    }

    .slideshow-close,
    .slideshow-controls {
      transition:
        opacity 0.35s ease,
        visibility 0.35s ease;
    }

    .slideshow-close {
      position: absolute;

      top: 20px;
      right: 20px;

      z-index: 10;

      background: rgba(255, 255, 255, 0.92);
      color: #930527;

      border-radius: 50%;

      width: 46px;
      height: 46px;

      padding: 0;

      font-size: 20px;

      box-shadow: none;
    }

    .slideshow-controls {
      position: absolute;

      bottom: 18px;
      left: 0;
      right: 0;

      display: flex;

      gap: 12px;

      align-items: center;
      justify-content: center;

      z-index: 10;
    }

    .slideshow-controls button {
      min-width: 52px;
      min-height: 46px;

      padding: 10px 15px;

      background: rgba(255, 255, 255, 0.92);
      color: #550317;

      box-shadow: none;

      backdrop-filter: blur(6px);
    }

    .slideshow-controls .slideshow-play {
      min-width: 90px;
    }

    .slideshow-controls.controls-hidden,
    .slideshow-close.controls-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    /* ==================================================
       NEW POST NOTIFICATION
       ================================================== */

    .new-post-notice {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%) translateY(-20px);
      z-index: 10000;

      background: white;
      color: var(--header);

      padding: 14px 22px;

      border-radius: 18px;

      box-shadow:
        0 8px 30px rgba(0, 0, 0, 0.18);

      font-weight: 600;

      opacity: 0;
      visibility: hidden;

      transition:
        opacity 0.3s ease,
        transform 0.3s ease,
        visibility 0.3s ease;
    }

    .new-post-notice.show {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 600px) {

      header {
        padding: 26px 18px 24px;
      }

      header h1 {
        font-size: 30px;
      }

      header p {
        font-size: 16px;
      }

      main {
        width: min(100% - 20px, 900px);
        margin-top: 16px;
      }

      .card,
      .post {
        padding: 20px;
        border-radius: 24px;
      }

      .top-bar {
        align-items: flex-start;
      }

      .top-bar h2 {
        font-size: 25px;
      }

      .post-message {
        font-size: 28px;
      }

      .post-footer {
        align-items: flex-start;
        flex-direction: column;
      }

      .reactions {
        width: 100%;
      }

      .comment-form {
        flex-direction: column;
      }

      .comment-send {
        width: 100%;
      }

      .comment-header {
        flex-direction: column;
        gap: 3px;
      }

      #slideshow-slide {
        width: 100vw;
        height: 100vh;
      }

      #slideshow-slide img {
        max-width: 100vw;
        max-height: 100vh;
        border-radius: 0;
      }

      .slideshow-message {
        bottom: 82px;

        font-size: 22px;

        padding:
          60px
          20px
          25px;
      }

      .slideshow-meta {
        bottom: 53px;

        font-size: 12px;

        padding:
          0
          15px;
      }

      .slideshow-counter {
        bottom: 25px;
      }

      .slideshow-close {
        top: 14px;
        right: 14px;

        width: 42px;
        height: 42px;
      }

      .slideshow-controls {
        bottom: 10px;

        gap: 8px;
      }

      .slideshow-controls button {
        min-width: 48px;
        min-height: 42px;

        padding: 8px 12px;
      }

      .slideshow-controls .slideshow-play {
        min-width: 82px;
      }

      .new-post-notice {
        width: calc(100% - 30px);
        text-align: center;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>Sharing happy moments 🩷</h1>
    <p>Use this to share pictures and your favourite stories</p>
  </header>

  <main>

    <div class="top-bar">

      <h2>Latest Updates</h2>

      <div class="button-row" style="margin-top: 0;">

        <button
          id="loginToggleButton"
          onclick="toggleLogin()"
        >
          Log in
        </button>

        <button
          id="logoutButton"
          class="secondary-button hidden"
          onclick="logout()"
        >
          Log out
        </button>

      </div>

    </div>

    <div
      id="loginCard"
      class="card login-card"
    >

      <h3>Log in 🩷</h3>

      <label for="email">
        Email
      </label>

      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="Your email"
      >

      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Your password"
      >

      <div class="button-row">

        <button onclick="login()">
          Log in
        </button>

      </div>

      <div
        id="loginStatus"
        class="status"
      ></div>

    </div>

    <div
      class="button-row"
      style="margin-top: 0; margin-bottom: 18px;"
    >

      <button
        id="slideshow-button"
        class="secondary-button"
        onclick="openSlideshow()"
      >
        🖼️ Slideshow
      </button>

    </div>

    <div
      id="slideshow-modal"
      class="slideshow-modal"
    >

      <div
        class="slideshow-content"
        id="slideshow-content"
      >

        <button
          id="slideshow-close"
          class="slideshow-close"
          onclick="closeSlideshow()"
          aria-label="Close slideshow"
        >
          ✕
        </button>

        <div id="slideshow-slide"></div>

        <div
          id="slideshow-controls"
          class="slideshow-controls"
        >

          <button
            onclick="previousSlide()"
            aria-label="Previous slide"
          >
            ←
          </button>

          <button
            id="slideshow-play-button"
            class="slideshow-play"
            onclick="toggleSlideshow()"
          >
            Play
          </button>

          <button
            onclick="nextSlide()"
            aria-label="Next slide"
          >
            →
          </button>

        </div>

      </div>

    </div>

    <div
      id="newPostCard"
      class="card new-post-card"
    >

      <h3>Share a message</h3>

      <label for="photo">
        Picture
      </label>

      <input
        id="photo"
        type="file"
        accept="image/*"
      >

      <label for="message">
        Message
      </label>

      <textarea
        id="message"
        placeholder="Share an update..."
      ></textarea>

      <label for="location">
        Location
        <span style="font-weight:400;">
          (optional)
        </span>
      </label>

      <input
        id="location"
        type="text"
        placeholder="e.g. Vienna 🇦🇹"
      >

      <label for="expiry">
        How long should this update stay?
      </label>

      <select id="expiry">

        <option value="forever">
          Keep forever
        </option>

        <option value="24h">
          Show for 24 hours
        </option>

        <option value="1week">
          Show for 1 week
        </option>

      </select>

      <div class="expiry-help">
        Expired updates will automatically disappear from the family feed.
      </div>

      <div class="button-row">

        <button onclick="createPost()">
          Share
        </button>

      </div>

      <div
        id="postStatus"
        class="status"
      ></div>

    </div>

    <div id="feed">

      <div class="empty-state">
        Please log in to see messages 🩷
      </div>

    </div>

  </main>

  <!-- NEW POST NOTICE -->

  <div
    id="newPostNotice"
    class="new-post-notice"
  >
    New family update 🩷
  </div>

  <script>

    const SUPABASE_URL =
      "https://efwhuwmnsikapsotlauy.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_71zpw_6tibul5KHmbaBE6A_BYGVb5FG";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const REACTIONS = [
      "🥰",
      "😂",
      "😭",
      "😱",
      "🩷",
      "🩵"
    ];

    let slideshowPosts = [];
    let slideshowIndex = 0;
    let slideshowTimer = null;
    let slideshowPlaying = false;
    let slideshowControlsTimer = null;

    let notificationTimeout = null;


    // --------------------------------------------------
    // SLIDESHOW CONTROL VISIBILITY
    // --------------------------------------------------

    function showSlideshowControls() {

      const controls =
        document.getElementById(
          "slideshow-controls"
        );

      const closeButton =
        document.getElementById(
          "slideshow-close"
        );

      if (!controls || !closeButton) {
        return;
      }

      controls.classList.remove(
        "controls-hidden"
      );

      closeButton.classList.remove(
        "controls-hidden"
      );

      if (slideshowControlsTimer) {

        clearTimeout(
          slideshowControlsTimer
        );

        slideshowControlsTimer = null;
      }

      slideshowControlsTimer =
        setTimeout(() => {

          hideSlideshowControls();

        }, 3000);
    }


    function hideSlideshowControls() {

      const controls =
        document.getElementById(
          "slideshow-controls"
        );

      const closeButton =
        document.getElementById(
          "slideshow-close"
        );

      if (!controls || !closeButton) {
        return;
      }

      controls.classList.add(
        "controls-hidden"
      );

      closeButton.classList.add(
        "controls-hidden"
      );
    }


    function resetSlideshowControlsTimer() {

      const modal =
        document.getElementById(
          "slideshow-modal"
        );

      if (!modal) {
        return;
      }

      if (
        modal.style.display !== "flex"
      ) {
        return;
      }

      showSlideshowControls();
    }


    // --------------------------------------------------
    // LOGIN UI
    // --------------------------------------------------

    function toggleLogin() {

      const card =
        document.getElementById(
          "loginCard"
        );

      if (
        card.style.display === "block"
      ) {

        card.style.display = "none";

      } else {

        card.style.display = "block";

      }
    }


    // --------------------------------------------------
    // LOGIN
    // --------------------------------------------------

    async function login() {

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;

      const status =
        document.getElementById(
          "loginStatus"
        );

      status.textContent =
        "Logging in...";

      const { error } =
        await supabaseClient.auth
          .signInWithPassword({
            email,
            password
          });

      if (error) {

        status.textContent =
          "Login failed: " +
          error.message;

        return;
      }

      status.textContent = "";

      document.getElementById(
        "loginCard"
      ).style.display = "none";
    }


    // --------------------------------------------------
    // LOGOUT
    // --------------------------------------------------

    async function logout() {

      closeSlideshow();

      await supabaseClient.auth.signOut();

      document.getElementById(
        "newPostCard"
      ).style.display = "none";

      document.getElementById(
        "logoutButton"
      ).classList.add("hidden");

      document.getElementById(
        "loginToggleButton"
      ).classList.remove("hidden");

      document.getElementById(
        "feed"
      ).innerHTML = `
        <div class="empty-state">
          Please log in to see messages 🩷
        </div>
      `;
    }


    // --------------------------------------------------
    // AUTH STATE
    // --------------------------------------------------

    supabaseClient.auth.onAuthStateChange(
      async (event, session) => {

        if (session) {

          document.getElementById(
            "newPostCard"
          ).style.display = "block";

          document.getElementById(
            "logoutButton"
          ).classList.remove("hidden");

          document.getElementById(
            "loginToggleButton"
          ).classList.add("hidden");

          await cleanupExpiredPosts();

          await loadPosts();

        } else {

          document.getElementById(
            "newPostCard"
          ).style.display = "none";

          document.getElementById(
            "logoutButton"
          ).classList.add("hidden");

          document.getElementById(
            "loginToggleButton"
          ).classList.remove("hidden");

        }

      }
    );


    // --------------------------------------------------
    // CLEAN UP EXPIRED POSTS
    // --------------------------------------------------

    async function cleanupExpiredPosts() {

      const now =
        new Date().toISOString();

      const {
        data: expiredPosts,
        error
      } = await supabaseClient
        .from("posts")
        .select("id, photo_url")
        .not(
          "expires_at",
          "is",
          null
        )
        .lte(
          "expires_at",
          now
        );

      if (error) {

        console.error(
          "Could not find expired posts:",
          error
        );

        return;
      }

      if (
        !expiredPosts ||
        expiredPosts.length === 0
      ) {
        return;
      }

      for (
        const post of expiredPosts
      ) {

        if (post.photo_url) {

          const {
            error: photoError
          } = await supabaseClient
            .storage
            .from("family-photos")
            .remove([
              post.photo_url
            ]);

          if (photoError) {

            console.error(
              "Could not delete expired photo:",
              photoError
            );
          }
        }

        const {
          error: deleteError
        } = await supabaseClient
          .from("posts")
          .delete()
          .eq(
            "id",
            post.id
          );

        if (deleteError) {

          console.error(
            "Could not delete expired post:",
            deleteError
          );
        }
      }
    }


    // --------------------------------------------------
    // LOAD REACTIONS
    // --------------------------------------------------

    async function getReactionData(
      postIds
    ) {

      const reactionData = {};

      for (
        const postId of postIds
      ) {

        reactionData[postId] = {
          counts: {},
          userReaction: null
        };

        for (
          const reaction of REACTIONS
        ) {

          reactionData[postId]
            .counts[reaction] = 0;
        }
      }

      if (
        postIds.length === 0
      ) {
        return reactionData;
      }

      const {
        data: reactions,
        error
      } = await supabaseClient
        .from("reactions")
        .select(
          "post_id, user_id, reaction"
        )
        .in(
          "post_id",
          postIds
        );

      if (error) {

        console.error(
          "Could not load reactions:",
          error
        );

        return reactionData;
      }

      const {
        data: userData
      } = await supabaseClient
        .auth
        .getUser();

      const currentUserId =
        userData?.user?.id ||
        null;

      for (
        const reaction of
        reactions || []
      ) {

        if (
          !reactionData[
            reaction.post_id
          ]
        ) {
          continue;
        }

        if (
          reactionData[
            reaction.post_id
          ].counts[
            reaction.reaction
          ] !== undefined
        ) {

          reactionData[
            reaction.post_id
          ].counts[
            reaction.reaction
          ]++;
        }

        if (
          currentUserId &&
          reaction.user_id ===
            currentUserId
        ) {

          reactionData[
            reaction.post_id
          ].userReaction =
            reaction.reaction;
        }
      }

      return reactionData;
    }


    // --------------------------------------------------
    // REACTION HTML
    // --------------------------------------------------

    function createReactionHtml(
      postId,
      reactionInfo
    ) {

      return `
        <div class="reactions">

          ${
            REACTIONS
              .map(reaction => {

                const count =
                  reactionInfo
                    .counts[
                      reaction
                    ] || 0;

                const active =
                  reactionInfo
                    .userReaction ===
                  reaction
                    ? "active"
                    : "";

                return `
                  <button
                    class="reaction-button ${active}"
                    onclick="toggleReaction('${postId}', '${reaction}')"
                    aria-label="React ${reaction}"
                  >
                    ${reaction}
                    <span class="reaction-count">
                      ${count}
                    </span>
                  </button>
                `;

              })
              .join("")
          }

        </div>
      `;
    }


    // --------------------------------------------------
    // TOGGLE REACTION
    // --------------------------------------------------

    async function toggleReaction(
      postId,
      reaction
    ) {

      const {
        data: userData
      } = await supabaseClient
        .auth
        .getUser();

      const user =
        userData?.user;

      if (!user) {

        alert(
          "Please log in to react to updates."
        );

        return;
      }

      const {
        data: existingReaction,
        error: findError
      } = await supabaseClient
        .from("reactions")
        .select(
          "id, reaction"
        )
        .eq(
          "post_id",
          postId
        )
        .eq(
          "user_id",
          user.id
        )
        .maybeSingle();

      if (findError) {

        alert(
          "Could not check your reaction: " +
          findError.message
        );

        return;
      }

      if (
        existingReaction &&
        existingReaction.reaction ===
          reaction
      ) {

        const {
          error
        } = await supabaseClient
          .from("reactions")
          .delete()
          .eq(
            "id",
            existingReaction.id
          );

        if (error) {

          alert(
            "Could not remove your reaction: " +
            error.message
          );

          return;
        }

        await loadPosts();

        return;
      }

      if (existingReaction) {

        const {
          error
        } = await supabaseClient
          .from("reactions")
          .update({
            reaction: reaction
          })
          .eq(
            "id",
            existingReaction.id
          );

        if (error) {

          alert(
            "Could not change your reaction: " +
            error.message
          );

          return;
        }

        await loadPosts();

        return;
      }

      const {
        error
      } = await supabaseClient
        .from("reactions")
        .insert({
          post_id: postId,
          user_id: user.id,
          reaction: reaction
        });

      if (error) {

        alert(
          "Could not add your reaction: " +
          error.message
        );

        return;
      }

      await loadPosts();
    }


    // --------------------------------------------------
    // LOAD COMMENTS
    // --------------------------------------------------

    async function getCommentData(
      postIds
    ) {

      const commentData = {};

      for (
        const postId of postIds
      ) {

        commentData[postId] = [];
      }

      if (
        postIds.length === 0
      ) {

        return commentData;
      }

      const {
        data: comments,
        error
      } = await supabaseClient
        .from("comments")
        .select(
          "id, post_id, user_id, comment, created_at"
        )
        .in(
          "post_id",
          postIds
        )
        .order(
          "created_at",
          {
            ascending: true
          }
        );

      if (error) {

        console.error(
          "Could not load comments:",
          error
        );

        return commentData;
      }

      const {
        data: userData
      } = await supabaseClient
        .auth
        .getUser();

      const currentUserId =
        userData?.user?.id ||
        null;

      const currentUserEmail =
        userData?.user?.email ||
        "";

      for (
        const comment of
        comments || []
      ) {

        if (
          !commentData[
            comment.post_id
          ]
        ) {
          continue;
        }

        comment.isOwn =
          currentUserId ===
          comment.user_id;

        comment.author =
          comment.isOwn
            ? currentUserEmail
            : "Family member";

        commentData[
          comment.post_id
        ].push(comment);
      }

      return commentData;
    }

    // COMMENT HTML
    // --------------------------------------------------

                      <button
                        class="comment-delete"

                    `
                    : "";

                return `
                  <div class="comment">

                      <div class="comment-author">
                        ${escapeHtml(
                          comment.author
                        )}
                      </div>

                      <div class="comment-date">

                      </div>

                    </div>

                    <div class="comment-text">
                      ${escapeHtml(

                      )}
                    </div>

                    ${deleteButton}

              })

              type="text"

              onkeydown="handleCommentKeydown(event, '${postId}')"
            >

            <button
              class="comment-send"

              Send
            </button>

          </div>

    // --------------------------------------------------
    // COMMENT ENTER KEY
    // --------------------------------------------------

    function handleCommentKeydown(
      event,
      postId
    ) {

      if (
        event.key === "Enter"
      ) {

        event.preventDefault();

        submitComment(
          postId
        );
      }
    }


    // --------------------------------------------------
    // ADD COMMENT
    // --------------------------------------------------

    async function submitComment(
      postId
    ) {

      const input =
        document.getElementById(
          `comment-input-${postId}`
        );

      if (!input) {
        return;
      }

      const comment =
        input.value.trim();

      if (!comment) {
        return;
      }

      const {
        data: userData
      } = await supabaseClient
        .auth
        .getUser();

      const user =
        userData?.user;

      if (!user) {

        alert(
          "Please log in to comment."
        );

        return;
      }

      input.disabled = true;

      const {
        error
      } = await supabaseClient
        .from("comments")
        .insert({
          post_id: postId,
          user_id: user.id,
          comment: comment
        });

      input.disabled = false;

      if (error) {

        alert(
          "Could not add your comment: " +
          error.message
        );

        return;
      }

      await loadPosts();
    }


    // --------------------------------------------------
    // DELETE COMMENT
    // --------------------------------------------------

    async function deleteComment(
      commentId
    ) {

      const confirmed =
        confirm(
          "Delete this comment?"
        );

      if (!confirmed) {
        return;
      }

      const {
        error
      } = await supabaseClient
        .from("comments")
        .delete()
        .eq(
          "id",
          commentId
        );

      if (error) {

        alert(
          "Could not delete the comment: " +
          error.message
        );

        return;
      }

      await loadPosts();
    }


    // --------------------------------------------------
    // LOAD POSTS
    // --------------------------------------------------

    async function loadPosts() {

      const feed =
        document.getElementById(
          "feed"
        );

      feed.innerHTML = `
        <div class="empty-state">
          Loading updates... 🩷
        </div>
      `;

      const now =
        new Date().toISOString();

      const {
        data,
        error
      } = await supabaseClient
        .from("posts")
        .select("*")
        .or(
          `expires_at.is.null,expires_at.gt.${now}`
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );

      if (error) {

        feed.innerHTML = `
          <div class="empty-state">
            Could not load updates.<br><br>
            ${escapeHtml(
              error.message
            )}
          </div>
        `;

        slideshowPosts = [];

        return;
      }

      if (
        !data ||
        data.length === 0
      ) {

        feed.innerHTML = `
          <div class="empty-state">
            No updates yet 🩷
          </div>
        `;

        slideshowPosts = [];

        return;
      }

      const postIds =
        data.map(
          post => post.id
        );

      const reactionData =
        await getReactionData(
          postIds
        );

      const commentData =
        await getCommentData(
          postIds
        );

      feed.innerHTML = "";

      slideshowPosts = [];


      for (
        const post of data
      ) {

        let imageHtml = "";

        let slideshowImageUrl =
          null;


        if (
          post.photo_url
        ) {

          const {
            data: signedData,
            error: signedError
          } = await supabaseClient
            .storage
            .from(
              "family-photos"
            )
            .createSignedUrl(
              post.photo_url,
              60 * 60
            );

          if (
            !signedError &&
            signedData?.signedUrl
          ) {

            slideshowImageUrl =
              signedData.signedUrl;

            imageHtml = `
              <img
                src="${escapeHtml(
                  signedData.signedUrl
                )}"
                alt="Family update"
              >
            `;
          }
        }


        let messageHtml = "";

        if (
          post.message
        ) {

          messageHtml = `
            <div class="post-message">
              ${escapeHtml(
                post.message
              )}
            </div>
          `;
        }


        const date =
          new Date(
            post.created_at
          );

        const formattedDate =
          date.toLocaleString(
            undefined,
            {
              dateStyle:
                "medium",
              timeStyle:
                "short"
            }
          );


        let locationHtml = "";

        if (
          post.location
        ) {

          locationHtml = `
            <div class="location">
              📍 ${escapeHtml(
                post.location
              )}
            </div>
          `;
        }


        let expiryHtml = "";

        if (
          post.expires_at
        ) {

          const expiryDate =
            new Date(
              post.expires_at
            );

          expiryHtml = `
            <div>
              ⏰ Until ${expiryDate.toLocaleString(
                undefined,
                {
                  dateStyle:
                    "medium",
                  timeStyle:
                    "short"
                }
              )}
            </div>
          `;
        }


        const postReactionData =
          reactionData[
            post.id
          ] || {
            counts: {},
            userReaction:
              null
          };

        const reactionsHtml =
          createReactionHtml(
            post.id,
            postReactionData
          );


        const postComments =
          commentData[
            post.id
          ] || [];

        const commentsHtml =
          createCommentHtml(
            post.id,
            postComments
          );


        slideshowPosts.push({
          imageUrl:
            slideshowImageUrl,

          message:
            post.message || "",

          date:
            formattedDate,

          location:
            post.location || ""
        });


        const postElement =
          document.createElement(
            "div"
          );

        postElement.className =
          "post";

        postElement.innerHTML = `
          ${imageHtml}

          ${messageHtml}

          <div class="post-meta">
            ${formattedDate}
            ${locationHtml}
            ${expiryHtml}
          </div>

          <div class="post-footer">

            ${reactionsHtml}

            <button
              class="delete-button"
              onclick="deletePost(
                '${post.id}',
                ${
                  post.photo_url
                    ? `'${escapeJs(
                        post.photo_url
                      )}'`
                    : "null"
                }
              )"
            >
              🗑️ Delete
            </button>

          </div>

          ${commentsHtml}
        `;

        feed.appendChild(
          postElement
        );
      }
    }


    // --------------------------------------------------
    // SLIDESHOW
    // --------------------------------------------------

    function openSlideshow() {

      if (
        slideshowPosts.length === 0
      ) {

        alert(
          "There are no updates to show yet."
        );

        return;
      }

      slideshowIndex = 0;

      const modal =
        document.getElementById(
          "slideshow-modal"
        );

      modal.style.display =
        "flex";

      document.body.style.overflow =
        "hidden";

      showSlideshowSlide();

      stopSlideshow();

      showSlideshowControls();
    }


    function closeSlideshow() {

      stopSlideshow();

      if (
        slideshowControlsTimer
      ) {

        clearTimeout(
          slideshowControlsTimer
        );

        slideshowControlsTimer =
          null;
      }

      const modal =
        document.getElementById(
          "slideshow-modal"
        );

      modal.style.display =
        "none";

      document.body.style.overflow =
        "";
    }


    function showSlideshowSlide() {

      if (
        slideshowPosts.length === 0
      ) {
        return;
      }

      const post =
        slideshowPosts[
          slideshowIndex
        ];

      const slide =
        document.getElementById(
          "slideshow-slide"
        );

      let imageHtml = "";

      if (
        post.imageUrl
      ) {

        imageHtml = `
          <img
            src="${escapeHtml(
              post.imageUrl
            )}"
            alt="Family update"
          >
        `;
      }


      let messageHtml = "";

      if (
        post.message
      ) {

        messageHtml = `
          <div class="slideshow-message">
            ${escapeHtml(
              post.message
            )}
          </div>
        `;
      }


      let locationHtml = "";

      if (
        post.location
      ) {

        locationHtml = `
          <div>
            📍 ${escapeHtml(
              post.location
            )}
          </div>
        `;
      }


      slide.innerHTML = `
        ${imageHtml}

        ${messageHtml}

        <div class="slideshow-meta">
          ${escapeHtml(
            post.date
          )}
          ${locationHtml}
        </div>

        <div class="slideshow-counter">
          ${
            slideshowIndex + 1
          } / ${
            slideshowPosts.length
          }
        </div>
      `;
    }


    function nextSlide() {

      if (
        slideshowPosts.length === 0
      ) {
        return;
      }

      slideshowIndex =
        (
          slideshowIndex + 1
        ) %
        slideshowPosts.length;

      showSlideshowSlide();

      resetSlideshowControlsTimer();
    }


    function previousSlide() {

      if (
        slideshowPosts.length === 0
      ) {
        return;
      }

      slideshowIndex =
        (
          slideshowIndex - 1 +
          slideshowPosts.length
        ) %
        slideshowPosts.length;

      showSlideshowSlide();

      resetSlideshowControlsTimer();
    }


    function startSlideshow() {

      if (
        slideshowPosts.length <= 1
      ) {
        return;
      }

      stopSlideshow();

      slideshowPlaying = true;

      document.getElementById(
        "slideshow-play-button"
      ).textContent = "Pause";

      showSlideshowControls();

      slideshowTimer =
        setInterval(() => {

          nextSlide();

        }, 5000);
    }


    function stopSlideshow() {

      if (
        slideshowTimer
      ) {

        clearInterval(
          slideshowTimer
        );

        slideshowTimer = null;
      }

      slideshowPlaying = false;

      const button =
        document.getElementById(
          "slideshow-play-button"
        );

      if (button) {

        button.textContent =
          "Play";
      }
    }


    function toggleSlideshow() {

      if (
        slideshowPlaying
      ) {

        stopSlideshow();

        showSlideshowControls();

      } else {

        startSlideshow();
      }
    }


    // --------------------------------------------------
    // SHOW SLIDESHOW CONTROLS WHEN USER INTERACTS
    // --------------------------------------------------

    const slideshowContent =
      document.getElementById(
        "slideshow-content"
      );


    slideshowContent.addEventListener(
      "mousemove",
      () => {

        resetSlideshowControlsTimer();

      }
    );


    slideshowContent.addEventListener(
      "touchstart",
      () => {

        resetSlideshowControlsTimer();

      },
      {
        passive: true
      }
    );


    slideshowContent.addEventListener(
      "click",
      event => {

        if (
          event.target.closest(
            "button"
          )
        ) {

          resetSlideshowControlsTimer();

          return;
        }

        resetSlideshowControlsTimer();

      }
    );


    // --------------------------------------------------
    // KEYBOARD CONTROLS
    // --------------------------------------------------

    document.addEventListener(
      "keydown",
      event => {

        const modal =
          document.getElementById(
            "slideshow-modal"
          );

        if (
          modal.style.display !==
          "flex"
        ) {
          return;
        }

        resetSlideshowControlsTimer();


        if (
          event.key === "Escape"
        ) {

          closeSlideshow();

        } else if (
          event.key === "ArrowRight"
        ) {

          nextSlide();

        } else if (
          event.key === "ArrowLeft"
        ) {

          previousSlide();

        } else if (
          event.key === " "
        ) {

          event.preventDefault();

          toggleSlideshow();
        }
      }
    );


    // --------------------------------------------------
    // CREATE POST
    // --------------------------------------------------

    async function createPost() {

      const photoInput =
        document.getElementById(
          "photo"
        );

      const messageInput =
        document.getElementById(
          "message"
        );

      const locationInput =
        document.getElementById(
          "location"
        );

      const expiryInput =
        document.getElementById(
          "expiry"
        );

      const status =
        document.getElementById(
          "postStatus"
        );

      const file =
        photoInput.files[0];

      const message =
        messageInput.value.trim();

      const location =
        locationInput.value.trim();

      const expiry =
        expiryInput.value;

      if (
        !file &&
        !message
      ) {

        status.textContent =
          "Please add a picture or a message.";

        return;
      }

      status.textContent =
        "Sharing with everyone";

      const {
        data: userData
      } = await supabaseClient
        .auth
        .getUser();

      if (
        !userData?.user
      ) {

        status.textContent =
          "Please log in again.";

        return;
      }


      let expiresAt =
        null;

      if (
        expiry === "24h"
      ) {

        expiresAt =
          new Date(
            Date.now() +
            24 *
            60 *
            60 *
            1000
          ).toISOString();

      } else if (
        expiry === "1week"
      ) {

        expiresAt =
          new Date(
            Date.now() +
            7 *
            24 *
            60 *
            60 *
            1000
          ).toISOString();
      }


      let photoPath =
        null;

      if (file) {

        const extension =
          file.name.includes(".")
            ? file.name
                .split(".")
                .pop()
                .toLowerCase()
            : "jpg";

        const fileName =
          Date.now() +
          "-" +
          crypto.randomUUID() +
          "." +
          extension;

        const {
          error: uploadError
        } = await supabaseClient
          .storage
          .from(
            "family-photos"
          )
          .upload(
            fileName,
            file
          );

        if (
          uploadError
        ) {

          status.textContent =
            "Photo upload failed: " +
            uploadError.message;

          return;
        }

        photoPath =
          fileName;
      }


      const {
        error: insertError
      } = await supabaseClient
        .from("posts")
        .insert({

          message:
            message || null,

          photo_url:
            photoPath,

          location:
            location || null,

          expires_at:
            expiresAt

        });

      if (
        insertError
      ) {

        if (
          photoPath
        ) {

          await supabaseClient
            .storage
            .from(
              "family-photos"
            )
            .remove([
              photoPath
            ]);
        }

        status.textContent =
          "Could not save the update: " +
          insertError.message;

        return;
      }


      photoInput.value =
        "";

      messageInput.value =
        "";

      locationInput.value =
        "";

      expiryInput.value =
        "forever";

      status.textContent =
        "Shared";

      await loadPosts();

      setTimeout(() => {

        status.textContent =
          "";

      }, 3000);
    }


    // --------------------------------------------------
    // DELETE POST
    // --------------------------------------------------

    async function deletePost(
      postId,
      photoPath
    ) {

      const confirmed =
        confirm(
          "Delete this update?\n\nThis cannot be undone."
        );

      if (
        !confirmed
      ) {
        return;
      }

      if (
        photoPath
      ) {

        const {
          error: photoError
        } = await supabaseClient
          .storage
          .from(
            "family-photos"
          )
          .remove([
            photoPath
          ]);

        if (
          photoError
        ) {

          console.error(
            "Photo deletion failed:",
            photoError
          );
        }
      }

      const {
        error
      } = await supabaseClient
        .from("posts")
        .delete()
        .eq(
          "id",
          postId
        );

      if (
        error
      ) {

        alert(
          "Could not delete the update: " +
          error.message
        );

        return;
      }

      await loadPosts();
    }


    // --------------------------------------------------
    // ESCAPE HTML
    // --------------------------------------------------

    function escapeHtml(
      value
    ) {

      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );
    }


    // --------------------------------------------------
    // ESCAPE JAVASCRIPT STRINGS
    // --------------------------------------------------

    function escapeJs(
      value
    ) {

      return String(value)
        .replace(
          /\\/g,
          "\\\\"
        )
        .replace(
          /'/g,
          "\\'"
        )
        .replace(
          /"/g,
          '\\"'
        )
        .replace(
          /\n/g,
          "\\n"
        )
        .replace(
          /\r/g,
          "\\r"
        );
    }


    // --------------------------------------------------
    // SHOW NEW POST NOTICE
    // --------------------------------------------------

    function showNewPostNotice() {

      const notice =
        document.getElementById(
          "newPostNotice"
        );

      if (!notice) {
        return;
      }

      notice.classList.add(
        "show"
      );

      if (
        notificationTimeout
      ) {

        clearTimeout(
          notificationTimeout
        );
      }

      notificationTimeout =
        setTimeout(() => {

          notice.classList.remove(
            "show"
          );

        }, 4000);
    }


    // --------------------------------------------------
    // REAL-TIME NEW POST DETECTION
    // --------------------------------------------------

    supabaseClient
      .channel("new-family-posts")
      .on(
        "postgres_changes",
        {
          event: "INSERT",
          schema: "public",
          table: "posts"
        },
        async (payload) => {

          const {
            data: userData
          } = await supabaseClient
            .auth
            .getUser();

          if (
            !userData?.user
          ) {
            return;
          }

          /*
           * If the newly created post belongs to
           * the currently logged-in user, don't
           * show a notification because the user
           * already knows they just posted it.
           */

          if (
            payload?.new?.created_by &&
            payload.new.created_by ===
              userData.user.id
          ) {

            return;
          }

          await loadPosts();

          showNewPostNotice();

          /*
           * We are NOT requesting browser notification
           * permission yet.
           *
           * That will be added in the next step.
           */

        }
      )
      .subscribe();


    // --------------------------------------------------
    // INITIAL SESSION CHECK
    // --------------------------------------------------

    async function checkSession() {

      const {
        data
      } = await supabaseClient
        .auth
        .getSession();

      if (
        data?.session
      ) {

        document.getElementById(
          "newPostCard"
        ).style.display =
          "block";

        document.getElementById(
          "logoutButton"
        ).classList.remove(
          "hidden"
        );

        document.getElementById(
          "loginToggleButton"
        ).classList.add(
          "hidden"
        );

        await cleanupExpiredPosts();

        await loadPosts();
      }
    }


    checkSession();


    // --------------------------------------------------
    // SERVICE WORKER / PWA
    // --------------------------------------------------

    if (
      "serviceWorker" in
      navigator
    ) {

      window.addEventListener(
        "load",
        () => {

          navigator.serviceWorker
            .register(
              "./service-worker.js"
            )

            .then(() => {

              console.log(
                "Service worker registered"
              );

            })

            .catch(error => {

              console.error(
                "Service worker registration failed:",
                error
              );

            });

        }
      );
    }

  </script>
