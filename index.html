<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Our Daily Updates 😊</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#930527">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link

  >

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --background: #F1E5D7;
      --header: #930527;
      --button: #550317;
      --white: #ffffff;
      --text: #333333;
      --soft-text: #666666;
      --border: #eadbd0;
      --delete: #8b1e3f;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font-family: "Montserrat", sans-serif;
    }

    header {
      background: var(--white);
      padding: 32px 24px 28px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.06);
    }

    header h1 {
      margin: 0;
      color: var(--header);
      font-family: "Raleway", sans-serif;
      font-size: 34px;
      font-weight: 700;
      line-height: 1.2;
    }

    header p {
      margin: 12px auto 0;
      max-width: 700px;
      font-size: 18px;
      line-height: 1.5;
      color: var(--soft-text);
    }

    main {
      width: min(900px, calc(100% - 32px));
      margin: 24px auto 50px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .top-bar h2 {
      margin: 0;
      color: var(--header);
      font-family: "Raleway", sans-serif;
      font-size: 28px;
      font-weight: 700;
    }

    button {
      border: none;
      border-radius: 18px;
      background: var(--button);
      color: white;
      font-family: "Montserrat", sans-serif;
      font-size: 16px;
      font-weight: 600;
      padding: 12px 18px;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(85, 3, 23, 0.18);
    }

    button:hover {
      opacity: 0.92;
    }

    button:active {
      transform: scale(0.98);
    }

    .secondary-button {
      background: white;
      color: var(--button);
      border: 1px solid var(--border);
      box-shadow: none;
    }

    .delete-button {
      background: white;
      color: var(--delete);
      border: 1px solid #e5c8d0;
      box-shadow: none;
      font-size: 14px;
      padding: 9px 14px;
    }

    .card {
      background: var(--white);
      border-radius: 28px;
      padding: 24px;
      margin-bottom: 22px;
      box-shadow: 0 7px 22px rgba(0, 0, 0, 0.07);
    }

    .login-card {
      display: none;
    }

    .login-card h3,
    .new-post-card h3 {
      margin-top: 0;
      color: var(--header);
      font-family: "Raleway", sans-serif;
      font-size: 25px;
    }

    label {
      display: block;
      margin: 14px 0 7px;
      font-size: 15px;
      font-weight: 600;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 14px 16px;
      background: #fffdfb;
      color: var(--text);
      font-family: "Montserrat", sans-serif;
      font-size: 16px;
      outline: none;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--header);
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    input[type="file"] {
      padding: 11px;
    }

    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .status {
      margin-top: 12px;
      font-size: 14px;
      color: var(--soft-text);
    }

    .new-post-card {
      display: none;
    }

    .expiry-help {
      margin-top: 7px;
      color: var(--soft-text);
      font-size: 13px;
      line-height: 1.4;
    }
