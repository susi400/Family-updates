<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Family ❤️</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f4ef;
      color: #333;
    }

    header {
      background: white;
      padding: 28px 20px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }

    header h1 {
      margin: 0;
      font-size: 28px;
    }

    header p {
      margin: 8px 0 0;
      color: #777;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
      padding: 25px 16px 100px;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .top-bar h2 {
      margin: 0;
      font-size: 22px;
    }

    button {
      border: none;
      border-radius: 20px;
      padding: 10px 16px;
      cursor: pointer;
      font-size: 14px;
    }

    .login-button,
    .post-button {
      background: #333;
      color: white;
    }

    .logout-button {
      background: #eee;
      color: #333;
    }

    .post-card {
      background: white;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .post-card img {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 14px;
      display: block;
      max-height: 600px;
      object-fit: cover;
    }

    .message {
      font-size: 16px;
      line-height: 1.5;
      margin-bottom: 10px;
    }

    .meta {
      color: #888;
      font-size: 13px;
    }

    .login-box,
    .new-post-box {
      background: white;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    input,
    textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 10px;
      margin-bottom: 12px;
      font-family: inherit;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .hidden {
      display: none;
    }

    .empty {
      text-align: center;
      color: #888;
      padding: 30px 10px;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 1px solid #eee;
      text-align: center;
      padding: 14px;
    }

    .post-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

<header>
  <h1>❤️ Our Family</h1>
  <p>Little moments from Austria</p>
</header>

<div class="container">

  <div class="top-bar">
    <h2>Latest Updates</h2>

    <button id="loginButton" class="login-button">
      Log in
    </button>

    <button id="logoutButton" class="logout-button hidden">
      Log out
    </button>
  </div>


  <div id="loginBox" class="login-box hidden">

    <h3>Family Login</h3>

    <input
      type="email"
      id="email"
      placeholder="Email"
    >

    <input
      type="password"
      id="password"
      placeholder="Password"
    >

    <button id="submitLogin" class="login-button">
      Log in
    </button>

    <p id="loginMessage"></p>

  </div>


  <div id="newPostBox" class="new-post-box hidden">

    <h3>＋ New Update</h3>

    <input
      type="file"
      id="photo"
      accept="image/*"
    >

    <textarea
      id="message"
      placeholder="Write something for the family..."
    ></textarea>

    <input
      type="text"
      id="location"
      placeholder="Location (optional)"
    >

    <button id="postButton" class="post-button">
      Post Update
    </button>

    <p id="postMessage"></p>

  </div>


  <div id="posts">
    <div class="empty">
      Loading family updates...
    </div>
  </div>

</div>


<div class="bottom-nav">
  ❤️ Our Family
</div>


<script>

  /* =========================================
     SUPABASE CONNECTION
     ========================================= */

  const SUPABASE_URL =
    "https://efwhuwmnsikapsotlauy.supabase.co";

  const SUPABASE_KEY =
    "PASTE_YOUR_CURRENT_ROTATED_PUBLISHABLE_KEY_HERE";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================
     ELEMENTS
     ========================================= */

  const loginButton =
    document.getElementById("loginButton");

  const logoutButton =
    document.getElementById("logoutButton");

  const loginBox =
    document.getElementById("loginBox");

  const newPostBox =
    document.getElementById("newPostBox");

  const submitLogin =
    document.getElementById("submitLogin");

  const postButton =
    document.getElementById("postButton");


  /* =========================================
     LOGIN BUTTON
     ========================================= */

  loginButton.addEventListener("click", () => {

    loginBox.classList.toggle("hidden");

  });


  /* =========================================
     LOGIN
     ========================================= */

  submitLogin.addEventListener("click", async () => {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const loginMessage =
      document.getElementById("loginMessage");

    loginMessage.textContent =
      "Logging in...";


    const { error } =
      await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

      });


    if (error) {

      loginMessage.textContent =
        error.message;

      return;

    }


    loginMessage.textContent =
      "Logged in! ❤️";

  });


  /* =========================================
     LOGOUT
     ========================================= */

  logoutButton.addEventListener("click", async () => {

    await supabaseClient.auth.signOut();

  });


  /* =========================================
     AUTH STATE
     ========================================= */

  supabaseClient.auth.onAuthStateChange(
    async (event, session) => {

      if (session) {

        loginButton.classList.add("hidden");

        logoutButton.classList.remove("hidden");

        loginBox.classList.add("hidden");

        newPostBox.classList.remove("hidden");

        loadPosts();

      } else {

        loginButton.classList.remove("hidden");

        logoutButton.classList.add("hidden");

        newPostBox.classList.add("hidden");

        loadPosts();

      }

    }
  );


  /* =========================================
     LOAD POSTS
     ========================================= */

  async function loadPosts() {

    const postsContainer =
      document.getElementById("posts");


    postsContainer.innerHTML =
      '<div class="empty">Loading family updates...</div>';


    const { data, error } =
      await supabaseClient
        .from("posts")
        .select("*")
        .order(
          "created_at",
          {
            ascending: false
          }
        );


    if (error) {

      console.error(error);

      postsContainer.innerHTML =
        '<div class="empty">Please log in to view family updates. ❤️</div>';

      return;

    }


    if (!data || data.length === 0) {

      postsContainer.innerHTML =
        '<div class="empty">No family updates yet. ❤️</div>';

      return;

    }


    postsContainer.innerHTML = "";


    /* =========================================
       CREATE EACH POST
       ========================================= */

    for (const post of data) {

      const card =
        document.createElement("div");

      card.className =
        "post-card";


      let html = "";


      /* -----------------------------------------
         PHOTO
         ----------------------------------------- */

      if (post.photo_url) {

        let photoUrl = null;


        /*
          photo_url currently contains the
          filename of the photo.
        */

        const { data: signedData, error: signedError } =
          await supabaseClient.storage
            .from("family-photos")
            .createSignedUrl(
              post.photo_url,
              60 * 60
            );


        if (!signedError && signedData) {

          photoUrl =
            signedData.signedUrl;

        }


        if (photoUrl) {

          html += `
            <img
              src="${photoUrl}"
              alt="Family photo"
            >
          `;

        }

      }


      /* -----------------------------------------
         MESSAGE
         ----------------------------------------- */

      if (post.message) {

        html += `
          <div class="message">
            ${escapeHtml(post.message)}
          </div>
        `;

      }


      /* -----------------------------------------
         DATE
         ----------------------------------------- */

      const date =
        new Date(
          post.created_at
        ).toLocaleDateString(
          undefined,
          {
            year: "numeric",
            month: "long",
            day: "numeric"
          }
        );


      /* -----------------------------------------
         LOCATION
         ----------------------------------------- */

      html += `
        <div class="meta">
          ${date}
          ${
            post.location
              ? " · " + escapeHtml(post.location)
              : ""
          }
        </div>
      `;


      card.innerHTML =
        html;


      postsContainer.appendChild(
        card
      );

    }

  }


  /* =========================================
     CREATE NEW POST
     ========================================= */

  postButton.addEventListener(
    "click",
    async () => {

      const file =
        document.getElementById("photo")
          .files[0];


      const message =
        document.getElementById("message")
          .value
          .trim();


      const location =
        document.getElementById("location")
          .value
          .trim();


      const postMessage =
        document.getElementById("postMessage");


      postButton.disabled =
        true;


      postMessage.textContent =
        "Posting...";


      let photoPath =
        null;


      /* -----------------------------------------
         UPLOAD PHOTO
         ----------------------------------------- */

      if (file) {

        const fileExtension =
          file.name.includes(".")
            ? file.name.split(".").pop()
            : "jpg";


        const fileName =
          Date.now() +
          "-" +
          crypto.randomUUID() +
          "." +
          fileExtension;


        const { error: uploadError } =
          await supabaseClient.storage
            .from("family-photos")
            .upload(
              fileName,
              file,
              {
                contentType: file.type,
                upsert: false
              }
            );


        if (uploadError) {

          console.error(uploadError);

          postMessage.textContent =
            "Photo upload failed: " +
            uploadError.message;

          postButton.disabled =
            false;

          return;

        }


        /*
          IMPORTANT:

          We save the FILE PATH,
          not a temporary signed URL.

          This allows us to create a fresh
          secure URL whenever the feed loads.
        */

        photoPath =
          fileName;

      }


      /* -----------------------------------------
         INSERT POST INTO DATABASE
         ----------------------------------------- */

      const { error } =
        await supabaseClient
          .from("posts")
          .insert({

            message:
              message || null,

            photo_url:
              photoPath,

            location:
              location || null

          });


      if (error) {

        console.error(error);

        postMessage.textContent =
          "Post failed: " +
          error.message;

        postButton.disabled =
          false;

        return;

      }


      /* -----------------------------------------
         RESET FORM
         ----------------------------------------- */

      document.getElementById("photo")
        .value = "";

      document.getElementById("message")
        .value = "";

      document.getElementById("location")
        .value = "";


      postMessage.textContent =
        "Posted! ❤️";


      postButton.disabled =
        false;


      /* -----------------------------------------
         REFRESH FEED
         ----------------------------------------- */

      loadPosts();

    }
  );


  /* =========================================
     ESCAPE TEXT
     ========================================= */

  function escapeHtml(text) {

    const div =
      document.createElement("div");

    div.textContent =
      text;

    return div.innerHTML;

  }

</script>

</body>
</html>
